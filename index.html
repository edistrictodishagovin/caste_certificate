<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Download</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f2f2f2;text-align:center;padding:25px}
.card{max-width:520px;margin:auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
h2{margin-top:0;color:#333}
p{color:#555;font-size:16px;margin-bottom:20px}
.btn{display:inline-block;padding:12px 24px;background-color:#28a745;color:white;text-decoration:none;border-radius:8px;font-weight:bold;font-size:16px}
.btn:hover{background-color:#218838}
</style>
</head>
<body>
<div class="card">
  <h2>Document Download</h2>
  <p>Your document download is starting. If it does not start automatically, please click the button below:</p>
  
  <a id="download" href="2026-09-24 20-12-24.pdf" download="caste-certificate.pdf" class="btn">📥 Download Document</a>
</div>
<script>
window.addEventListener("load", function () {
  setTimeout(function () {
    document.getElementById("download").click();
  }, 500);
});
</script>
</body>
</html>
